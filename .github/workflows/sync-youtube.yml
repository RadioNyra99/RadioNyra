name: Auto-Sync YouTube Videos

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync latest YouTube videos
        run: node scripts/sync-youtube.mjs

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/youtube-live.json
          if git diff --staged --quiet; then
            echo "No new YouTube videos detected."
          else
            git commit -m "chore(youtube): auto-sync latest channel uploads"
            git push origin main
          fi
